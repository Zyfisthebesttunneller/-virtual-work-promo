<script>
'use strict';
// ======================================================================== timeline constants
const W = 1920, H = 1080, BPM = 90, BEAT = 60 / BPM, BAR = BEAT * 4, EIGHTH = BEAT / 2, NBARS = 61, TOTAL = NBARS * BAR + 4;
const EXPORT = /[?&]export=1/.test(location.search);
const cv = document.getElementById('c'), CTX0 = cv.getContext('2d');
let ctx = CTX0;
const PI = Math.PI, TAU = PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };

const win = (t, a, b, fi = .5, fo = .5) => sstep(a, a + fi, t) * (1 - sstep(b - fo, b, t));

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const F_ZH = '"Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "SimSun", serif';
const F_EN = '"Cinzel", "Trajan Pro", "Times New Roman", serif';
const F_IT = '"Cormorant Garamond", "Garamond", "Times New Roman", serif';
const F_MATH = '"STIX Two Text", "Cambria Math", "Latin Modern Math", "Times New Roman", serif';
// colour language used throughout: force = orange, imagined motion = cyan, work = gold, constraint = magenta
const C_FORCE = '255,140,70', C_VIRT = '80,215,255', C_WORK = '255,205,110', C_CONS = '255,70,165', C_OK = '110,255,170', C_BAD = '255,72,72', C_STEEL = '190,210,240';

// ======================================================================== drawing primitives
function text(s, x, y, o = {}) {

function measure(s, size, weight = 400, font = F_ZH, style = '') { ctx.save(); ctx.font = `${style} ${weight} ${size}px ${font}`; const w = ctx.measureText(s).width; ctx.restore(); return w; }

function sprite(col) {

  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.1, `rgba(${col},.95)`); g.addColorStop(.35, `rgba(${col},.28)`); g.addColorStop(.7, `rgba(${col},.06)`); g.addColorStop(1, `rgba(${col},0)`);

}

// neon stroke of an arbitrary path: wide faint halo, mid glow, bright core

}

}
function goldGrad(x0, y0, x1, y1, s) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, '#6e4b1b'); g.addColorStop(.35, '#d9b25c');
  if (s > .05 && s < .95) { g.addColorStop(s - .05, '#e7c574'); g.addColorStop(s, '#fff6dc'); g.addColorStop(s + .05, '#e7c574'); }
  g.addColorStop(.7, '#c99a45'); g.addColorStop(1, '#7a5520');

}
function titleLayout(str, cx, size, ls, font = F_ZH, weight = 900) {
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; const ws = [...str].map(c => ctx.measureText(c).width); ctx.restore();
  const total = ws.reduce((a, b) => a + b, 0) + ls * (ws.length - 1); let x = cx - total / 2;
  return ws.map(w => { const r = { x: x + w / 2, w, total }; x += w + ls; return r; });
}
// gold title, letter by letter, with a travelling specular sheen
function titleWord(str, cx, cy, size, lt, t0, stagger, ls, a = 1, grow = .6, font = F_ZH, weight = 900) {
  if (a <= .003) return;
  const L = titleLayout(str, cx, size, ls, font, weight), total = L[0].total, sheenX = cx - total / 2 + (((lt * .32) % 1.8) - .3) * total;
  ctx.save(); ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  [...str].forEach((ch, i) => {
    const { x, w } = L[i], k = clamp((lt - t0 - i * stagger) / 1.0);
    if (k <= 0) return;
    const e = eexpo(k), sc = 1 + grow * (1 - e);
    ctx.save(); ctx.translate(x, cy); ctx.scale(sc, sc); ctx.globalAlpha = clamp(k * 2.5) * a;
    ctx.shadowColor = 'rgba(255,180,80,.55)'; ctx.shadowBlur = 50;
    ctx.fillStyle = goldGrad(-w / 2, -size / 2, w / 2, size / 2, (sheenX - (x - w / 2)) / w); ctx.fillText(ch, 0, 0);

}
function glitchText(s, x, y, size, a, font = F_EN, seed = 0, col = '#fff') {
  if (a <= 0) return;
  const j = (hash1(seed * 7.1) - .5) * 14;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  text(s, x - 5 + j, y, { font, size, color: 'rgba(255,60,80,1)', alpha: a * .55 });
  text(s, x + 5 - j, y, { font, size, color: 'rgba(60,220,255,1)', alpha: a * .55 });

}
function flare(x, y, a, len = 900) {
  if (a <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(x - len, 0, x + len, 0);
  g.addColorStop(0, 'rgba(120,170,255,0)'); g.addColorStop(.5, `rgba(255,236,200,${.9 * a})`); g.addColorStop(1, 'rgba(120,170,255,0)');
  ctx.fillStyle = g; ctx.fillRect(x - len, y - 2, len * 2, 4);
  ctx.globalAlpha = .35 * a; ctx.fillRect(x - len * .6, y - 9, len * 1.2, 18);
  ctx.restore();

}
function sunburst(cx, cy, lt, a, n = 24, col = '255,200,120') {
  if (a <= 0) return;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(lt * .05); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1100); g.addColorStop(0, `rgba(${col},${.16 * a})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g;
  for (let i = 0; i < n; i++) { const a0 = i * TAU / n; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 1200, a0, a0 + TAU / n * .45); ctx.fill(); }
  ctx.restore();
}
function dim(a) { if (a > 0) { ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fillRect(0, 0, W, H); } }
function bracket(x, y0, y1, side, col, a, label, lsize = 34) {   // a measuring bracket with a label
  if (a <= .003 || Math.abs(y1 - y0) < 2) return;
  const d = side * 16;
  neon(() => { ctx.moveTo(x + d, y0); ctx.lineTo(x, y0); ctx.lineTo(x, y1); ctx.lineTo(x + d, y1); }, col, 2.2, a, false);
  if (label) text(label, x - side * 40, (y0 + y1) / 2, { font: F_MATH, size: lsize, color: `rgb(${col})`, alpha: a, glow: `rgba(${col},.8)`, blur: 14, weight: 700 });
}
function ring(x, y, r, col, a, w = 2) { neon(() => ctx.arc(x, y, r, 0, TAU), col, w, a, false); }

// ======================================================================== backgrounds: painted once, drifted every frame
const rnd = mulberry(20261007);
const STARS = Array.from({ length: 520 }, () => ({ x: rnd() * W, y: rnd() * H, z: .2 + rnd() * .8, p: rnd() * TAU }));
function starfield(t, a = 1, vx = 8, vy = 0) {
  if (a <= 0) return;
  ctx.save(); ctx.fillStyle = '#fff';
  for (const s of STARS) {
    const x = ((s.x + t * vx * s.z) % W + W) % W, y = ((s.y + t * vy * s.z) % H + H) % H;
    ctx.globalAlpha = a * s.z * (.55 + .45 * Math.sin(t * 2 + s.p));
    const r = s.z * 2.2; ctx.fillRect(x, y, r, r);
  }
  ctx.restore();
}
const NEB = {};
function paintNebula(name, tint, seed) {     // domain-warped fbm cloud, painted once at low resolution
  const w = 640, h = 360, c = mk(w, h), x = c.getContext('2d'), img = x.createImageData(w, h), d = img.data;
  const hs = (i, j) => { const n = Math.sin(i * 127.1 + j * 311.7 + seed * 74.7) * 43758.5453; return n - Math.floor(n); };
  const noise = (px, py) => { const i = Math.floor(px), j = Math.floor(py); let fx = px - i, fy = py - j; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);

paintNebula('blue', [.12, .2, .55], 1); paintNebula('gold', [.42, .27, .08], 2); paintNebula('teal', [.05, .32, .38], 3); paintNebula('violet', [.3, .1, .48], 4);
function nebula(name, t, a = 1, zoom = 1.18) {

  ctx.save(); ctx.imageSmoothingQuality = 'high';
  const s = zoom + .04 * Math.sin(t * .05), w = W * s, h = H * s, dx = (W - w) / 2 + 40 * Math.sin(t * .031), dy = (H - h) / 2 + 26 * Math.cos(t * .027);

function bgGrad(c0, c1, cx = W / 2, cy = H / 2) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 1200);
  g.addColorStop(0, c0); g.addColorStop(1, c1); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

function blueprint(a, t = 0) {     // the faint graph-paper grid of the "imagination" scenes
  if (a <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const off = (t * 6) % 60;
  ctx.strokeStyle = `rgba(80,180,255,${.05 * a})`; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = -off; x < W; x += 60) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }

function ground(y, a = 1, col = '226,189,107') {
  if (a <= 0) return;

// sample filled pixels of a drawing (used to morph particles between shapes)
function samplePts(drawFn, n, step = 3, seed = 7) {

// ======================================================================== the lever: the film's recurring hero object
const LV = { cx: W / 2, cy: 610, u: 165 }, BEAM_H = 18, BEAM_L = 2.75;
const MASS = [{ s: -1, m: 2, size: 132 }, { s: 2, m: 1, size: 94 }];

  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#e2bd6b'; ctx.fillRect(x + nw + 20 + slide, y - 26, 2, 52); ctx.restore();
  text(zh, x + nw + 42 + slide, y - 8, { size: 36, weight: 700, color: '#fff', alpha: a, align: 'left' });
  text(en, x + nw + 44 + slide, y + 30, { font: F_EN, size: 16, ls: 5, color: '#cdb88e', alpha: a, align: 'left' });
}
function subtitles(T) {
  for (const s of SUBS) {
    if (T < s.a - .3 || T > s.b + .3) continue;
    const a = win(T, s.a, s.b, .25, .3); if (a <= 0) continue;
    ctx.save(); const g = ctx.createLinearGradient(0, 880, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${.6 * a})`); ctx.fillStyle = g; ctx.fillRect(0, 880, W, 200); ctx.restore();
    text(s.zh, W / 2, 970, { size: 42, weight: 700, color: '#fff', alpha: a, glow: 'rgba(0,0,0,.9)', blur: 12, ls: 2 });
    text(s.en, W / 2, 1026, { font: F_IT, style: 'italic', size: 29, color: '#ddd5c4', alpha: a * .9, glow: 'rgba(0,0,0,.9)', blur: 8 });
  }
}
function overlays(T) {
  const lb = 138 * Math.max(1 - eio(clamp((T - SC[1].t0) / .9)), eio(clamp((T - (TOTAL - 7)) / 2)));
  if (lb > .5) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, lb); ctx.fillRect(0, H - lb, W, lb); }
  const sc = sceneAt(T); chapter(sc, T - sc.t0);
  subtitles(T);
  let flash = 0; for (const [th, k] of HITS) if (T >= th && T < th + 1.5) flash += .75 * k * Math.exp(-(T - th) * 5);
  if (flash > .01) { ctx.fillStyle = `rgba(255,248,235,${Math.min(.9, flash)})`; ctx.fillRect(0, 0, W, H); }
}
function frame(T) {
  T = clamp(T, 0, TOTAL - 1e-3);
  const sc = sceneAt(T);
  drawLayer(T);
  grade(T, sc);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  overlays(T);
}

// ======================================================================== fonts, playback, export hooks
let fontsReady = false;
const SRC = [...document.scripts].map(s => s.textContent).join('');
const CHARS = [...new Set(SRC.replace(/[\x00-\x7f]/g, ''))].join('') + 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
Promise.all([
  ...['400', '700', '900'].map(w => document.fonts.load(`${w} 40px "Noto Serif SC"`, CHARS)),
  document.fonts.load('400 40px "Cinzel"'), document.fonts.load('700 40px "Cinzel"'), document.fonts.load('italic 500 40px "Cormorant Garamond"'), document.fonts.load('500 40px "Cormorant Garamond"'),
  document.fonts.load('400 40px "STIX Two Text"', CHARS), document.fonts.load('italic 400 40px "STIX Two Text"', CHARS),
]).catch(() => {}).then(() => document.fonts.ready).then(() => { fontsReady = true; const l = document.getElementById('load'); if (l) l.textContent = '字体已就绪 · 建议全屏观看（F）'; frame(0); });
setTimeout(() => { fontsReady = true; }, 15000);

window.__ready = () => fontsReady;
window.__frame = t => { frame(t); return cv.toDataURL('image/jpeg', .93); };
window.__duration = TOTAL;
window.__smoke = (t0, t1, step) => {      // draw every frame time on a tiny canvas and report any exception
  const small = mk(192, 108), old = ctx, errs = []; ctx = small.getContext('2d'); SS = .1;
  for (let t = t0; t < t1; t += step) { try { drawLayer(t); overlays(t); } catch (e) { errs.push([+t.toFixed(3), String(e)]); } }
  ctx = old; SS = 1; return errs; };
window.__perf = T => { const sc = sceneAt(T), a = performance.now(); drawLayer(T); ctx.getImageData(0, 0, 1, 1); const b = performance.now(); grade(T, sc); ctx.getImageData(0, 0, 1, 1); const c = performance.now();
  overlays(T); ctx.getImageData(0, 0, 1, 1); const d = performance.now(); cv.toDataURL('image/jpeg', .93); const e = performance.now(); return [b - a, c - b, d - c, e - d].map(x => Math.round(x)); };
window.__cues = () => SC.flatMap(s => (s.sfx || []).map(([t, name, o]) => ({ t: +(s.t0 + t).toFixed(4), name, ...(o || {}) }))).sort((a, b) => a.t - b.t);

const au = document.getElementById('au');
if (!EXPORT) au.src = (window.EMBED && window.EMBED.audio) ? 'data:audio/mpeg;base64,' + window.EMBED.audio : 'music.mp3';
if (EXPORT) { document.getElementById('start').remove(); document.getElementById('ui').remove(); }
else {
  let playing = false, clock0 = 0, useAudio = true, hideT = 0;
  const ui = document.getElementById('ui'), pp = document.getElementById('pp'), fill = document.getElementById('fill'), tm = document.getElementById('tm');
  document.getElementById('dur').textContent = `${Math.floor(TOTAL / 60)}:${String(Math.round(TOTAL % 60)).padStart(2, '0')}`;
  const now = () => useAudio ? au.currentTime : (performance.now() - clock0) / 1000;
  function loop() {
    const T = now(); frame(T);
    fill.style.width = (T / TOTAL * 100) + '%'; tm.textContent = `${Math.floor(T / 60)}:${String(Math.floor(T % 60)).padStart(2, '0')}`;
    if (T >= TOTAL - .05) { playing = false; pp.textContent = '▶'; }
    if (playing) requestAnimationFrame(loop);
  }
  function play() { playing = true; pp.textContent = '❚❚'; au.play().catch(() => { useAudio = false; clock0 = performance.now() - au.currentTime * 1000; }); requestAnimationFrame(loop); }
  function pause() { playing = false; pp.textContent = '▶'; au.pause(); }
  document.getElementById('go').onclick = () => { document.getElementById('start').remove(); if (au.currentTime >= TOTAL - .1) au.currentTime = 0; play(); poke(); };
  pp.onclick = () => playing ? pause() : play();
  document.getElementById('bar').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); au.currentTime = clamp((e.clientX - r.left) / r.width) * TOTAL; if (!useAudio) clock0 = performance.now() - au.currentTime * 1000; if (!playing) frame(au.currentTime); };
  document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  function poke() { ui.classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => ui.classList.add('hide'), 2200); }
  addEventListener('mousemove', poke); addEventListener('touchstart', poke, { passive: true });
  addEventListener('keydown', e => {
    if (document.getElementById('start')) return;
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'KeyF') document.getElementById('fs').click();
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { au.currentTime = clamp(au.currentTime + (e.code === 'ArrowRight' ? 5 : -5), 0, TOTAL); if (!playing) frame(au.currentTime); }
    poke();
  });
}
